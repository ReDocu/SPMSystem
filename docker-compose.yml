services:
  db:
    image: postgres:17-alpine
    container_name: spm-db
    environment:
      POSTGRES_DB: spm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - spm-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spm-pgdata:
