<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Malgun Gothic', system-ui, sans-serif; color: #334155; background: #ffffff; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
    .mut { color: #94a3b8; }
    .sm { font-size: 12px; }
    .row { display: flex; align-items: center; }
    .n { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 50%; background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 700; flex: none; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid #cbd5e1; border-radius: 999px; font-size: 11px; color: #64748b; background: #f8fafc; white-space: nowrap; }
  </style>
</helmet>
<div style="width: 680px; height: 420px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
  <div style="width: 540px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(51, 65, 85, 0.15);">
    <div class="row" style="padding: 16px 20px; gap: 10px; border-bottom: 1.5px solid #e2e8f0;">
      <span class="mut" style="font-weight: 700;">&gt;</span>
      <span style="font-size: 14px;">14-16 SPM 개발</span>
      <span style="width: 2px; height: 16px; background: #334155;"></span>
    </div>
    <div class="row" style="padding: 12px 20px; gap: 10px; background: #eff6ff;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.8V8l2.2 1.6"></path></svg>
      <span style="font-size: 13px; color: #1e40af;">오늘 타임로그로 저장</span>
      <span class="tag" style="border-color: #93c5fd; color: #2563eb; background: #ffffff;">14:00–16:00</span>
      <span class="n">1</span>
    </div>
    <div style="height: 1.5px; background: #e2e8f0;"></div>
    <div class="row" style="padding: 12px 20px; gap: 10px;">
      <span class="tag">↵</span>
      <span style="font-size: 13px; color: #475569;">인박스에 저장</span>
    </div>
    <div class="row" style="padding: 12px 20px; gap: 10px; border-top: 1px solid #f1f5f9;">
      <span class="tag">→</span>
      <span style="font-size: 13px; color: #475569;">이동: 일정 / 프로젝트 / 운영 / 자료</span>
      <span class="sm mut" style="margin-left: auto;">텍스트 없을 때</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
