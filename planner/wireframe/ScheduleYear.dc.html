<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Malgun Gothic', system-ui, sans-serif; color: #334155; background: #ffffff; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
    .mut { color: #94a3b8; }
    .sm { font-size: 12px; }
    .row { display: flex; align-items: center; }
    .box { border: 1.5px solid #cbd5e1; border-radius: 10px; background: #ffffff; }
    .dashed { border: 1.5px dashed #cbd5e1; border-radius: 8px; background: #ffffff; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid #cbd5e1; border-radius: 999px; font-size: 11px; color: #64748b; background: #f8fafc; white-space: nowrap; }
    .n { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 50%; background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 700; flex: none; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 12px; color: #475569; background: #ffffff; white-space: nowrap; }
    .nav { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: #475569; }
    .nava { background: #e2e8f0; color: #1e293b; font-weight: 500; }
    .seg { padding: 5px 14px; font-size: 12px; color: #64748b; }
    .sega { background: #334155; color: #ffffff; border-radius: 5px; font-weight: 500; }
    .chk { width: 13px; height: 13px; border: 1.5px solid #94a3b8; border-radius: 3px; flex: none; display: inline-block; box-sizing: border-box; }
    .chkd { background: #64748b; border-color: #64748b; }
    .grip { display: inline-flex; flex-direction: column; gap: 2.5px; margin-left: auto; flex: none; }
    .grip span { width: 14px; height: 1.5px; background: #cbd5e1; display: block; }
  </style>
</helmet>
<div style="width: 1000px; height: 800px; background: #ffffff; display: flex; box-sizing: border-box;">
  <div style="width: 200px; flex: none; border-right: 1.5px solid #e2e8f0; background: #f8fafc; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 12px; gap: 2px;">
    <div style="font-weight: 700; font-size: 15px; padding: 4px 10px 14px; letter-spacing: 2px;">SPM</div>
    <div class="nav nava"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.8V8l2.2 1.6"></path></svg>일정</div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5"><rect x="2.2" y="2.8" width="3.2" height="10.4" rx="1"></rect><rect x="6.4" y="2.8" width="3.2" height="7" rx="1"></rect><rect x="10.6" y="2.8" width="3.2" height="4.6" rx="1"></rect></svg>프로젝트</div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5"><rect x="2" y="2.8" width="12" height="4.4" rx="1.2"></rect><rect x="2" y="8.8" width="12" height="4.4" rx="1.2"></rect><path d="M4.6 5h.01M4.6 11h.01" stroke-linecap="round" stroke-width="2"></path></svg>운영·배포</div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"><path d="M4 2.5h8v11L8 10.4 4 13.5z"></path></svg>자료수집</div>
    <div style="height: 1.5px; background: #e2e8f0; margin: 10px 6px;"></div>
    <div class="nav" style="justify-content: space-between;">
      <span class="row" style="gap: 8px;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"><path d="M2 9.2 3.8 3.5h8.4L14 9.2V13H2z"></path><path d="M2 9.2h3.4l1 2h3.2l1-2H14"></path></svg>인박스</span>
      <span class="tag">7</span>
    </div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5.2h11M2.5 10.8h11"></path><circle cx="6" cy="5.2" r="1.7" fill="#f8fafc"></circle><circle cx="10" cy="10.8" r="1.7" fill="#f8fafc"></circle></svg>설정</div>
    <div style="flex: 1;"></div>
    <div class="dashed sm mut" style="padding: 8px 10px; text-align: center;">⌘K 빠른 입력</div>
  </div>
  <div style="flex: 1; padding: 22px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; min-width: 0;">
    <div class="row" style="justify-content: space-between;">
      <div class="row" style="gap: 8px;">
        <div class="btn" style="padding: 5px 9px;">◀</div>
        <span style="font-size: 16px; font-weight: 700;">2026년</span>
        <div class="btn" style="padding: 5px 9px;">▶</div>
        <div class="btn">오늘</div>
        <div class="row box" style="padding: 3px; border-radius: 7px; gap: 2px; margin-left: 10px;">
          <span class="seg">일별</span><span class="seg">달별</span><span class="seg sega">연별</span>
        </div>
      </div>
      <div class="row" style="gap: 8px;">
        <span style="font-size: 14px; color: #475569;">7/15 완료</span>
        <span class="n">1</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="box row" style="padding: 12px 16px; gap: 10px;">
        <span class="chk chkd"></span>
        <span class="mut" style="font-size: 14px; text-decoration: line-through;">SPM v0.1 실사용 시작</span>
        <span class="tag">#SPM</span>
        <span class="grip"><span></span><span></span><span></span></span>
        <span class="n">2</span>
      </div>
      <div class="box row" style="padding: 12px 16px; gap: 10px;">
        <span class="chk"></span>
        <span style="font-size: 14px;">블로그 30편 작성</span>
        <span class="grip"><span></span><span></span><span></span></span>
      </div>
      <div class="box row" style="padding: 12px 16px; gap: 10px;">
        <span class="chk"></span>
        <span style="font-size: 14px;">이직 포트폴리오 정리</span>
        <span class="tag">마감 12/31</span>
        <span class="grip"><span></span><span></span><span></span></span>
      </div>
      <div class="box row" style="padding: 12px 16px; gap: 10px; background: #fafafa;">
        <span class="chk" style="border-color: #cbd5e1;"></span>
        <span class="mut" style="font-size: 14px; text-decoration: line-through;">알고리즘 스터디</span>
        <span class="tag">dropped</span>
        <span class="grip"><span></span><span></span><span></span></span>
      </div>
      <div class="dashed row mut" style="padding: 12px 16px; font-size: 13px;">+ 올해 하고 싶은 일</div>
    </div>
    <div class="box" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
      <div class="row" style="gap: 8px; font-size: 13px; font-weight: 700;">올해의 기념일<span class="n">3</span></div>
      <div class="row" style="gap: 10px; font-size: 13px;"><span class="mut sm" style="width: 28px;">2월</span><span class="mut">결혼기념일 (지남)</span></div>
      <div class="row" style="gap: 10px; font-size: 13px;"><span class="mut sm" style="width: 28px;">9월</span>부모님 생신<span class="tag">D-12</span></div>
      <div class="dashed row mut sm" style="padding: 8px 12px;">+ 기념일</div>
    </div>
    <div class="sm mut">연말: 미완료 일괄 "내년으로 보내기" or dropped · 지난 연도는 읽기 전용 아카이브</div>
  </div>
</div>
</x-dc>
</body>
</html>
