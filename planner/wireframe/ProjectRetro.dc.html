<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Malgun Gothic', system-ui, sans-serif; color: #334155; background: #ffffff; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
    .mut { color: #94a3b8; }
    .sm { font-size: 12px; }
    .row { display: flex; align-items: center; }
    .box { border: 1.5px solid #cbd5e1; border-radius: 10px; background: #ffffff; }
    .dashed { border: 1.5px dashed #cbd5e1; border-radius: 8px; background: #ffffff; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid #cbd5e1; border-radius: 999px; font-size: 11px; color: #64748b; background: #f8fafc; white-space: nowrap; }
    .n { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 50%; background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 700; flex: none; }
    .nav { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: #475569; }
    .nava { background: #e2e8f0; color: #1e293b; font-weight: 500; }
    .tab { padding: 8px 4px; font-size: 13px; color: #94a3b8; margin-right: 20px; }
    .taba { color: #1e293b; font-weight: 700; border-bottom: 2px solid #334155; }
  </style>
</helmet>
<div style="width: 1000px; height: 720px; background: #ffffff; display: flex; box-sizing: border-box;">
  <div style="width: 200px; flex: none; border-right: 1.5px solid #e2e8f0; background: #f8fafc; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 12px; gap: 2px;">
    <div style="font-weight: 700; font-size: 15px; padding: 4px 10px 14px; letter-spacing: 2px;">SPM</div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.8V8l2.2 1.6"></path></svg>일정</div>
    <div class="nav nava"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5"><rect x="2.2" y="2.8" width="3.2" height="10.4" rx="1"></rect><rect x="6.4" y="2.8" width="3.2" height="7" rx="1"></rect><rect x="10.6" y="2.8" width="3.2" height="4.6" rx="1"></rect></svg>프로젝트</div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5"><rect x="2" y="2.8" width="12" height="4.4" rx="1.2"></rect><rect x="2" y="8.8" width="12" height="4.4" rx="1.2"></rect><path d="M4.6 5h.01M4.6 11h.01" stroke-linecap="round" stroke-width="2"></path></svg>운영·배포</div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"><path d="M4 2.5h8v11L8 10.4 4 13.5z"></path></svg>자료수집</div>
    <div style="height: 1.5px; background: #e2e8f0; margin: 10px 6px;"></div>
    <div class="nav" style="justify-content: space-between;">
      <span class="row" style="gap: 8px;"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"><path d="M2 9.2 3.8 3.5h8.4L14 9.2V13H2z"></path><path d="M2 9.2h3.4l1 2h3.2l1-2H14"></path></svg>인박스</span>
      <span class="tag">7</span>
    </div>
    <div class="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 5.2h11M2.5 10.8h11"></path><circle cx="6" cy="5.2" r="1.7" fill="#f8fafc"></circle><circle cx="10" cy="10.8" r="1.7" fill="#f8fafc"></circle></svg>설정</div>
    <div style="flex: 1;"></div>
    <div class="dashed sm mut" style="padding: 8px 10px; text-align: center;">⌘K 빠른 입력</div>
  </div>
  <div style="flex: 1; padding: 24px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
    <div class="row" style="gap: 10px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #64748b; flex: none;"></span>
      <span style="font-size: 18px; font-weight: 700;">SPM</span>
      <span class="tag">completed</span>
    </div>
    <div class="row" style="border-bottom: 1.5px solid #e2e8f0;">
      <span class="tab">개요</span><span class="tab">태스크</span><span class="tab">문서</span><span class="tab taba">회고</span>
    </div>
    <div class="box row" style="padding: 14px 18px; gap: 10px; background: #f8fafc;">
      <span style="font-size: 13px; color: #475569;">기간 172일 · 총 61h · 완료 47 · 드롭 9 · 배포 12회</span>
      <span class="n">1</span>
      <span class="sm mut" style="margin-left: auto;">작성 시점 스냅샷</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 6px;">
      <div class="row" style="gap: 14px;">
        <span style="font-size: 13px; width: 130px; flex: none;">1. 잘한 것</span>
        <div class="dashed" style="flex: 1; height: 44px;"></div>
      </div>
      <div class="row" style="gap: 14px;">
        <span style="font-size: 13px; width: 130px; flex: none;">2. 아쉬운 것</span>
        <div class="dashed" style="flex: 1; height: 44px;"></div>
      </div>
      <div class="row" style="gap: 14px;">
        <span style="font-size: 13px; width: 130px; flex: none;">3. 배운 것</span>
        <div class="dashed" style="flex: 1; height: 44px;"></div>
      </div>
      <div class="row" style="gap: 14px;">
        <span class="row" style="font-size: 13px; width: 130px; flex: none; font-weight: 700; gap: 5px;">
          4. 다음에 안 할 것
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.4l-3.6 1.9.7-4L2.2 6.5l4-.6z"></path></svg>
        </span>
        <div class="dashed" style="flex: 1; height: 44px; border-color: #94a3b8;"></div>
      </div>
    </div>
    <div class="sm mut" style="margin-top: auto;">G4 게이트(completed / dropped 전이)에서 작성 · 진행 중에는 "프로젝트를 마치면 회고를 작성합니다"</div>
  </div>
</div>
</x-dc>
</body>
</html>
