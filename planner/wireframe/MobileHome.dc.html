<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Malgun Gothic', system-ui, sans-serif; color: #334155; background: #ffffff; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
    .mut { color: #94a3b8; }
    .sm { font-size: 12px; }
    .row { display: flex; align-items: center; }
    .box { border: 1.5px solid #cbd5e1; border-radius: 10px; background: #ffffff; }
    .dashed { border: 1.5px dashed #cbd5e1; border-radius: 8px; background: #ffffff; }
    .tag { display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid #cbd5e1; border-radius: 999px; font-size: 11px; color: #64748b; background: #f8fafc; white-space: nowrap; }
    .n { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 50%; background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 700; flex: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; padding: 60px 20px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; position: relative;">
  <div class="row" style="justify-content: space-between;">
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">SPM</span>
    <span class="mut" style="font-size: 13px;">8/27 (목)</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div class="box" style="padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 118px; box-sizing: border-box;">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size: 12px; font-weight: 500;">일정</span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444;"></span>
      </div>
      <span style="font-size: 19px; font-weight: 700;">남은 3</span>
      <span class="sm" style="color: #475569;">15:00 병원</span>
    </div>
    <div class="box" style="padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 118px; box-sizing: border-box;">
      <span style="font-size: 12px; font-weight: 500;">프로젝트</span>
      <span style="font-size: 19px; font-weight: 700;">진행 2</span>
      <div style="height: 4px; background: #e2e8f0; border-radius: 2px;"><div style="width: 68%; height: 4px; background: #64748b; border-radius: 2px;"></div></div>
    </div>
    <div class="box" style="padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 118px; box-sizing: border-box;">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size: 12px; font-weight: 500;">운영·배포</span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #f59e0b;"></span>
      </div>
      <span style="font-size: 19px; font-weight: 700;">운영 1</span>
      <span class="sm" style="color: #475569;">SSL D-7</span>
    </div>
    <div class="box" style="padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 118px; box-sizing: border-box;">
      <span style="font-size: 12px; font-weight: 500;">자료수집</span>
      <span style="font-size: 19px; font-weight: 700;">수집 5</span>
      <span class="sm" style="color: #475569;">아이디어 9</span>
    </div>
  </div>
  <div class="box row" style="padding: 0 16px; height: 48px; gap: 10px;">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"><path d="M2 9.2 3.8 3.5h8.4L14 9.2V13H2z"></path><path d="M2 9.2h3.4l1 2h3.2l1-2H14"></path></svg>
    <span style="font-size: 13px; color: #475569;">인박스 7건 미처리</span>
    <span class="mut" style="margin-left: auto;">→</span>
  </div>
  <div class="dashed sm mut" style="padding: 12px 14px;">공유 시트 → 인박스 캡처 직행 (PWA)</div>
  <div style="position: absolute; right: 20px; bottom: 34px; display: flex; align-items: center; gap: 8px;">
    <span class="n">1</span>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(51, 65, 85, 0.3);">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
